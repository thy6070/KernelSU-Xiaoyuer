name: JD-32713 SP

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  prepare:
    runs-on: ubuntu-latest
    outputs:
      cert_size: ${{ steps.cert.outputs.size }}
      cert_hash: ${{ steps.cert.outputs.hash }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - name: Extract jidao cert
        id: cert
        run: |
          PASS=$(cat .github/brand/jidao_pass.txt)
          keytool -exportcert -keystore .github/brand/jidao.jks -alias jidao -storepass "$PASS" -file cert.der
          SIZE=$(stat -c%s cert.der)
          HASH=$(openssl x509 -inform DER -in cert.der -outform DER | sha256sum | cut -d' ' -f1)
          echo "size=0x$(printf '%03x' $SIZE)" >> "$GITHUB_OUTPUT"
          echo "hash=$HASH" >> "$GITHUB_OUTPUT"
          echo "cert $SIZE $HASH"

  ksud:
    needs: prepare
    runs-on: ubuntu-latest
    steps:
      - name: Clone official 32713
        run: |
          git clone -q https://github.com/tiann/KernelSU.git src
          cd src
          git checkout 5955f6bcb48a0fd8ab5cd7cec91be13bb2f5bdc3
          git rev-list --count HEAD

      - name: Setup rust
        run: |
          rustup update stable
          rustup target add aarch64-linux-android

      - uses: nttld/setup-ndk@v1
        id: ndk
        with:
          ndk-version: r29

      - name: Build ksuinit
        env:
          ANDROID_NDK_HOME: ${{ steps.ndk.outputs.ndk-path }}
        run: |
          cd src
          source .github/scripts/setup-rust-build.sh aarch64-linux-android 26
          BUILTINS="$($CLANG_PATH --print-resource-dir)/lib/linux/libclang_rt.builtins-aarch64-android.a"
          test -f "$BUILTINS"
          export RUSTFLAGS="-C target-feature=+crt-static -C link-arg=-Wl,-z,max-page-size=16384 -C link-arg=-Wno-unused-command-line-argument -C link-arg=$BUILTINS"
          cargo build --package ksuinit --target=aarch64-linux-android --release
          mkdir -p userspace/ksud/bin/aarch64
          cp target/aarch64-linux-android/release/ksuinit userspace/ksud/bin/aarch64/
          ls -l userspace/ksud/bin/aarch64/

      - name: Build ksud (embeds ksuinit)
        env:
          ANDROID_NDK_HOME: ${{ steps.ndk.outputs.ndk-path }}
          KSU_PACKAGE_NAME: com.tencent.THY
        run: |
          cd src
          source .github/scripts/setup-rust-build.sh aarch64-linux-android 26
          cargo build --target "$TRIPLE" --release --manifest-path ./userspace/ksud/Cargo.toml
          ls -l target/aarch64-linux-android/release/ksud

      - uses: actions/upload-artifact@v4
        with:
          name: ksud-aarch64
          path: |
            src/target/aarch64-linux-android/release/ksud
            src/target/aarch64-linux-android/release/ksuinit

  apk:
    needs: [prepare, ksud]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Clone official 32713
        run: |
          git clone -q https://github.com/tiann/KernelSU.git src
          cd src
          git checkout 5955f6bcb48a0fd8ab5cd7cec91be13bb2f5bdc3
          echo "commit count: $(git rev-list --count HEAD)"

      - name: Overlay our changes
        run: |
          cp manager/app/build.gradle.kts src/manager/app/build.gradle.kts
          cp manager/app/src/main/AndroidManifest.xml src/manager/app/src/main/AndroidManifest.xml
          cp manager/app/src/main/res/mipmap-anydpi/ic_launcher.xml src/manager/app/src/main/res/mipmap-anydpi/ic_launcher.xml
          mkdir -p src/manager/app/src/main/res/drawable-nodpi
          cp manager/app/src/main/res/drawable-nodpi/ic_zysu.png src/manager/app/src/main/res/drawable-nodpi/ic_zysu.png

      - name: Spoof namespace
        run: |
          cd src
          python3 ../.github/brand/spoof_ns.py
          echo "spoof ok"
          grep -rIl "me\.weishu\.kernelsu" manager/ | head -5 || true

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - uses: gradle/actions/setup-gradle@v3

      - name: Build APK
        run: |
          cd src/manager
          chmod +x gradlew
          ./gradlew :app:assembleRelease -x lint

      - name: Download ksud
        uses: actions/download-artifact@v4
        with:
          name: ksud-aarch64
          path: ksud-out

      - name: Inject ksud + ksuinit
        run: |
          KSUD=$(find ksud-out -type f -name ksud | head -n1)
          KINIT=$(find ksud-out -type f -name ksuinit | head -n1)
          test -n "$KSUD"; test -n "$KINIT"
          APK=$(find src/manager/app/build/outputs/apk/release -name "*.apk" | head -n1)
          test -n "$APK"
          mkdir -p inj/lib/arm64-v8a inj/assets
          cp "$KSUD" inj/lib/arm64-v8a/libksud.so
          cp "$KINIT" inj/assets/ksuinit
          chmod 644 inj/lib/arm64-v8a/libksud.so inj/assets/ksuinit
          cd inj && zip -q -r "../$APK" lib assets && cd ..
          # re-align for safety
          BT=$(ls -d $ANDROID_HOME/build-tools/* | tail -n1)
          $BT/zipalign -f -p 4 "$APK" aligned.apk
          ls -l aligned.apk

      - name: Sign APK (v2 only)
        run: |
          PASS=$(cat .github/brand/jidao_pass.txt)
          BT=$(ls -d $ANDROID_HOME/build-tools/* | tail -n1)
          $BT/apksigner sign --ks .github/brand/jidao.jks --ks-key-alias jidao \
            --ks-pass "pass:$PASS" --key-pass "pass:$PASS" \
            --v1-signing-enabled true --v2-signing-enabled true --v3-signing-enabled false \
            --out manager-32713-sp.apk aligned.apk
          $BT/apksigner verify --print-certs manager-32713-sp.apk | head -4

      - name: Verify package
        run: |
          python3 - <<'EOF'
          import struct, hashlib, zipfile
          d=open('manager-32713-sp.apk','rb').read()
          eocd=d.rfind(b'PK\x05\x06')
          cd_size, cd_off = struct.unpack_from('<II', d, eocd+12)
          pairs_end = cd_off - 0x18
          size_of_block = struct.unpack_from('<Q', d, pairs_end)[0]
          pos = cd_off - 0x8 - size_of_block + 8
          ids=[]
          while pos < pairs_end:
              ln = struct.unpack_from('<Q', d, pos)[0]; pos += 8
              id_ = struct.unpack_from('<I', d, pos)[0]
              ids.append(hex(id_))
              if id_ == 0x7109871a:
                  q=pos+4
                  def lpv(q):
                      n=struct.unpack_from('<I', d, q)[0]; return n,q+4
                  n,q=lpv(q); se=q+n
                  n,q=lpv(q); si=q+n
                  n,q=lpv(q); sd=q+n
                  n,q=lpv(q); dg=q+n
                  q=dg
                  n,q=lpv(q); ce=q+n
                  cs=struct.unpack_from('<I', d, q)[0]; q+=4
                  print('cert', cs, hashlib.sha256(d[q:q+cs]).hexdigest())
              pos += ln
          print('blocks', ids)
          assert '0xf05368c0' not in ids
          z=zipfile.ZipFile('manager-32713-sp.apk')
          names=z.namelist()
          assert 'lib/arm64-v8a/libksud.so' in names, 'ksud missing'
          assert 'assets/ksuinit' in names, 'ksuinit missing'
          dex=b''
          for n in names:
              if n.endswith('.dex'): dex += z.read(n)
          print('dex leftover count:', dex.count(b'me.weishu.kernelsu'), 'thy count:', dex.count(b'com.tencent.THY'))
          print('APK check OK', len(names), 'entries')
          EOF

      - uses: actions/upload-artifact@v4
        with:
          name: manager-32713-sp
          path: manager-32713-sp.apk

      - name: Publish
        uses: softprops/action-gh-release@v2
        with:
          tag_name: jd-32713-sp
          name: 极道帝兵 32713 sp
          files: manager-32713-sp.apk
