name: JD Resign v2-only

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  resign:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Download current APK
        run: |
          curl -sL --retry 3 -o in.apk \
            https://github.com/thy6070/KernelSU-Xiaoyuer/releases/download/jd-32713/manager-32713.apk
          ls -l in.apk

      - name: Resign (v2 only, no v3 block)
        run: |
          PASS=$(cat .github/brand/jidao_pass.txt)
          BT=$(ls -d $ANDROID_HOME/build-tools/* | tail -n1)
          $BT/apksigner sign \
            --ks .github/brand/jidao.jks \
            --ks-key-alias jidao \
            --ks-pass "pass:$PASS" \
            --key-pass "pass:$PASS" \
            --v1-signing-enabled true \
            --v2-signing-enabled true \
            --v3-signing-enabled false \
            --out manager-32713-v2.apk in.apk
          $BT/apksigner verify --print-certs manager-32713-v2.apk | head -6

      - name: Check signing block ids
        run: |
          python3 - <<'EOF'
          import struct, hashlib
          d=open('manager-32713-v2.apk','rb').read()
          eocd=d.rfind(b'PK\x05\x06')
          cd_size, cd_off = struct.unpack_from('<II', d, eocd+12)
          pairs_end = cd_off - 0x18
          size_of_block = struct.unpack_from('<Q', d, pairs_end)[0]
          pos = cd_off - 0x8 - size_of_block + 8
          ids=[]
          while pos < pairs_end:
              ln = struct.unpack_from('<Q', d, pos)[0]; pos += 8
              id_ = struct.unpack_from('<I', d, pos)[0]
              ids.append(hex(id_))
              if id_ == 0x7109871a:
                  q = pos + 4
                  def lpv(q):
                      n = struct.unpack_from('<I', d, q)[0]; return n, q+4
                  n,q=lpv(q); se=q+n
                  n,q=lpv(q); si=q+n
                  n,q=lpv(q); sd=q+n
                  n,q=lpv(q); dg=q+n
                  q=dg
                  n,q=lpv(q); ce=q+n
                  cs=struct.unpack_from('<I', d, q)[0]; q+=4
                  print('cert size', cs, 'hash', hashlib.sha256(d[q:q+cs]).hexdigest())
              pos += ln
          print('blocks:', ids)
          assert '0xf05368c0' not in ids, 'v3 block still present!'
          EOF

      - uses: softprops/action-gh-release@v2
        with:
          tag_name: jd-32713
          files: manager-32713-v2.apk
