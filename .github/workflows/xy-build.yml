name: XY Build

on:
  workflow_dispatch:
  push:
    branches: [ main ]
    paths:
      - 'manager/**'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: 'recursive'

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Spoof namespace
        run: python3 .github/brand/spoof_ns.py

      - name: Signing setup
        run: |
          echo "KEYSTORE_FILE=$PWD/.github/brand/signing.jks" >> $GITHUB_ENV
          echo "KEYSTORE_PASSWORD=$(cat .github/brand/pass.txt)" >> $GITHUB_ENV
          echo "KEY_ALIAS=xiaoyuer" >> $GITHUB_ENV
          echo "KEY_PASSWORD=$(cat .github/brand/pass.txt)" >> $GITHUB_ENV

      - name: Build
        run: |
          cp .github/brand/signing.jks manager/signing.jks
          cd manager
          chmod +x gradlew
          ./gradlew :app:assembleRelease -x lint \
            -PKEYSTORE_FILE="$PWD/signing.jks" \
            -PKEYSTORE_PASSWORD="$(cat ../.github/brand/pass.txt)" \
            -PKEY_ALIAS=xiaoyuer \
            -PKEY_PASSWORD="$(cat ../.github/brand/pass.txt)"

      - name: Publish
        uses: softprops/action-gh-release@v2
        with:
          tag_name: xy-latest
          name: 小鱼儿
          files: manager/app/build/outputs/apk/release/*.apk
          prerelease: true

      - uses: actions/upload-artifact@v4
        with:
          name: manager-apk
          path: manager/app/build/outputs/apk/release/*.apk
