name: XY Build

on:
  workflow_dispatch:
  push:
    branches: [ main ]
    paths:
      - 'manager/**'

permissions:
  contents: write

jobs:
  build-ksud:
    uses: ./.github/workflows/ksud.yml
    with:
      target: aarch64-linux-android
      pack_ksuinit: true

  build:
    needs: [build-ksud]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: 'recursive'

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Signing setup
        run: |
          echo "KEYSTORE_FILE=$PWD/.github/brand/jidao.jks" >> $GITHUB_ENV
          echo "KEYSTORE_PASSWORD=$(cat .github/brand/jidao_pass.txt)" >> $GITHUB_ENV
          echo "KEY_ALIAS=jidao" >> $GITHUB_ENV
          echo "KEY_PASSWORD=$(cat .github/brand/jidao_pass.txt)" >> $GITHUB_ENV

      - name: Spoof namespace
        run: python3 .github/brand/spoof_ns.py

      - name: Build
        run: |
          cp .github/brand/jidao.jks manager/signing.jks
          export KEYSTORE_FILE="$(pwd)/manager/signing.jks"
          export KEYSTORE_PASSWORD="$(cat .github/brand/jidao_pass.txt)"
          export KEY_ALIAS="xiaoyuer"
          export KEY_PASSWORD="$(cat .github/brand/jidao_pass.txt)"
          echo "KS=$KEYSTORE_FILE exists=$(test -f "$KEYSTORE_FILE" && echo yes || echo no)"
          cd manager
          chmod +x gradlew
          ./gradlew :app:assembleRelease -x lint

      - name: Download ksuinit
        uses: actions/download-artifact@v8
        with:
          name: ksuinit-aarch64
          path: ksuinit-out

      - name: Inject ksuinit
        run: |
          KINIT=$(find ksuinit-out -type f -name ksuinit | head -n1)
          test -n "$KINIT"
          APK=$(find manager/app/build/outputs/apk/release -name "*.apk" | head -n1)
          mkdir -p kinit_inject/assets
          cp -f "$KINIT" kinit_inject/assets/ksuinit
          cd kinit_inject && zip -q -r "../$APK" assets && cd ..

      - name: Download ksud
        uses: actions/download-artifact@v8
        with:
          name: ksud-aarch64-linux-android
          path: ksud-out

      - name: Inject ksud
        run: |
          KSUD=$(find ksud-out -type f -name ksud | head -n1)
          test -n "$KSUD"
          APK=$(find manager/app/build/outputs/apk/release -name "*.apk" | head -n1)
          mkdir -p ksud_inject/lib/arm64-v8a
          cp -f "$KSUD" ksud_inject/lib/arm64-v8a/libksud.so
          cd ksud_inject && zip -q -r "../$APK" lib && cd ..

      - name: Sign APK
        run: |
          APK=$(find manager/app/build/outputs/apk/release -name "*.apk" | head -n1)
          test -n "$APK"
          BT=$(ls -d $ANDROID_HOME/build-tools/* | tail -n1)
          $BT/apksigner sign --ks .github/brand/jidao.jks \
            --ks-key-alias jidao \
            --ks-pass "pass:$(cat .github/brand/jidao_pass.txt)" \
            --key-pass "pass:$(cat .github/brand/jidao_pass.txt)" \
            "$APK"
          $BT/apksigner verify --print-certs "$APK" | head -5

      - name: Rename APK
        run: |
          n="${{ github.run_number }}"
          for f in manager/app/build/outputs/apk/release/*.apk; do
            base=$(basename "$f" .apk)
            mv "$f" "manager/app/build/outputs/apk/release/${base}-${n}.apk"
          done

      - name: Publish
        uses: softprops/action-gh-release@v2
        with:
          tag_name: xy-latest
          name: 小鱼儿
          files: manager/app/build/outputs/apk/release/*.apk
          prerelease: true

      - uses: actions/upload-artifact@v4
        with:
          name: manager-apk
          path: manager/app/build/outputs/apk/release/*.apk
