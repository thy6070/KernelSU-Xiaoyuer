name: fpsbinder2
on: workflow_dispatch

jobs:
  build2:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/no-autostart
          persist-credentials: false
      - uses: nttld/setup-ndk@v1
        id: ndk
        with:
          ndk-version: r29

      - name: fetch ALL AOSP headers (LineageOS mirror)
        run: |
          B="https://raw.githubusercontent.com/LineageOS/android_frameworks_native/lineage-22.0"
          A="https://api.github.com/repos/LineageOS/android_frameworks_native/contents"
          for dir in "libs/binder/include/binder" "libs/utils/include/utils"; do
            mkdir -p "aosp/$dir"
            curl -s "$A/$dir?ref=lineage-22.0" > /tmp/list.json
            for n in $(jq -r '.[].name' /tmp/list.json 2>/dev/null); do
              curl -sL --max-time 20 -o "aosp/$dir/$n" "$B/$dir/$n"
            done
          done
          echo "binder: $(ls aosp/libs/binder/include/binder | wc -l) files"
          echo "utils: $(ls aosp/libs/utils/include/utils | wc -l) files"
          ls aosp/libs/binder/include/binder | head -5

      - name: build fpsbinder2
        run: |
          NDK="${{ steps.ndk.outputs.ndk-path }}"
          CXX="$NDK/toolchains/llvm/prebuilt/linux-x86_64/bin/aarch64-linux-android34-clang++"
          "$CXX" -O2 -std=c++17 -I aosp/libs/binder/include -I aosp/libs/utils/include -I aosp/include native/fpsbinder2.cpp -o fpsbinder2 -Wl,--unresolved-symbols=ignore-all -ldl 2>&1 | tail -25
          ls -lh fpsbinder2 2>/dev/null || echo "build failed"

      - uses: actions/upload-artifact@v4
        with:
          name: fpsbinder2
          path: fpsbinder2
          if-no-files-found: warn
