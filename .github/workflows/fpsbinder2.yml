name: fpsbinder2
on: workflow_dispatch

jobs:
  build2:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/no-autostart
          persist-credentials: false
      - uses: nttld/setup-ndk@v1
        id: ndk
        with:
          ndk-version: r29

      - name: fetch ALL AOSP headers
        run: |
          B="https://raw.githubusercontent.com/LineageOS/android_frameworks_native/lineage-22.0"
          A="https://api.github.com/repos/LineageOS/android_frameworks_native/contents"
          mkdir -p aosp/libs/binder/include/binder aosp/libs/utils/include/utils aosp/libs/base/include/android-base
          # binder (list dir)
          curl -s "$A/libs/binder/include/binder?ref=lineage-22.0" > /tmp/l1.json
          for n in $(jq -r '.[].name' /tmp/l1.json 2>/dev/null); do curl -sL --max-time 20 -o "aosp/libs/binder/include/binder/$n" "$B/libs/binder/include/binder/$n"; done
          # utils (list dir)
          curl -s "$A/libs/utils/include/utils?ref=lineage-22.0" > /tmp/l2.json
          for n in $(jq -r '.[].name' /tmp/l2.json 2>/dev/null); do curl -sL --max-time 20 -o "aosp/libs/utils/include/utils/$n" "$B/libs/utils/include/utils/$n"; done
          # android-base (libbase from system_core)
          SB="https://raw.githubusercontent.com/LineageOS/android_system_core/lineage-22.0/libbase/include/android-base"
          for f in unique_fd logging macros stringprintf strings errors mapped_file scope_guard parseln file_map thread_annotations result.h; do curl -sL --max-time 20 -o "aosp/libs/base/include/android-base/$f" "$SB/$f"; done
          echo "binder: $(ls aosp/libs/binder/include/binder | wc -l) utils: $(ls aosp/libs/utils/include/utils | wc -l) base: $(ls aosp/libs/base/include/android-base | wc -l)"

      - name: build fpsbinder2
        run: |
          NDK="${{ steps.ndk.outputs.ndk-path }}"
          CXX="$NDK/toolchains/llvm/prebuilt/linux-x86_64/bin/aarch64-linux-android34-clang++"
          "$CXX" -O2 -std=c++17 -I aosp/libs/binder/include -I aosp/libs/utils/include -I aosp/libs/base/include -I aosp/include native/fpsbinder2.cpp -o fpsbinder2 -Wl,--unresolved-symbols=ignore-all -ldl 2>&1 | tail -25
          ls -lh fpsbinder2 2>/dev/null || echo "build failed"

      - uses: actions/upload-artifact@v4
        with:
          name: fpsbinder2
          path: fpsbinder2
          if-no-files-found: warn
