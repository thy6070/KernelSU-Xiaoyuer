name: fpsbinder2
on: workflow_dispatch

jobs:
  build2:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/no-autostart
          persist-credentials: false
      - uses: nttld/setup-ndk@v1
        id: ndk
        with:
          ndk-version: r29

      - name: fetch headers
        run: |
          B="https://raw.githubusercontent.com/LineageOS/android_frameworks_native/lineage-22.0"
          mkdir -p aosp/libs/binder/include/binder aosp/libs/utils/include/utils aosp/libs/base/include
          for f in IBinder Parcel ProcessState IPCThreadState IServiceManager IInterface BpBinder Binder Status Debug Common unique_fd ParcelableHolder IMemory IMemoryHeap; do
            curl -sL --max-time 20 -o "aosp/libs/binder/include/binder/$f.h" "$B/libs/binder/include/binder/$f.h" || true
          done
          U="https://raw.githubusercontent.com/LineageOS/android_frameworks_native/lineage-22.0"
          curl -s "https://api.github.com/repos/LineageOS/android_frameworks_native/contents/libs/utils/include/utils?ref=lineage-22.0" > /tmp/ul.json
          for n in $(jq -r '.[].name' /tmp/ul.json 2>/dev/null); do
            curl -sL --max-time 20 -o "aosp/libs/utils/include/utils/$n" "$U/libs/utils/include/utils/$n" || true
          done
          echo "utils 完整列表:"; ls aosp/libs/utils/include/utils/ | tr '\n' ' '; echo
          echo "utils 文件:"
          ls aosp/libs/utils/include/utils/ 2>/dev/null | head -10
          echo "utils 数量: $(ls aosp/libs/utils/include/utils/ 2>/dev/null | wc -l)"
          cp -r native/headers/android-base aosp/libs/base/include/
          echo "base: $(ls aosp/libs/base/include/android-base | wc -l)"
          ls aosp/libs/base/include/android-base | head -5

      - name: build fpsbinder2
        run: |
          NDK="${{ steps.ndk.outputs.ndk-path }}"
          CXX="$NDK/toolchains/llvm/prebuilt/linux-x86_64/bin/aarch64-linux-android34-clang++"
          "$CXX" -O2 -std=c++17 -I aosp/libs/binder/include -I aosp/libs/utils/include -I aosp/libs/base/include -I aosp/include native/fpsbinder2.cpp -o fpsbinder2 -Wl,--unresolved-symbols=ignore-all -ldl 2>&1 | tail -25
          ls -lh fpsbinder2 2>/dev/null || echo "build failed"

      - uses: actions/upload-artifact@v4
        with:
          name: fpsbinder2
          path: fpsbinder2
          if-no-files-found: warn
