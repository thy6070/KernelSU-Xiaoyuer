name: fpsbinder2
on: workflow_dispatch

jobs:
  build2:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/no-autostart
          persist-credentials: false
      - uses: nttld/setup-ndk@v1
        id: ndk
        with:
          ndk-version: r29

      - name: fetch AOSP headers (googlesource)
        run: |
          B="https://android.googlesource.com/platform/frameworks/native/+/refs/heads/main"
          mkdir -p aosp/libs/binder/include/binder aosp/libs/utils/include/utils
          for f in IBinder Parcel ProcessState IPCThreadState IServiceManager IInterface BpBinder Binder BinderProxy Status Debug IPermissionController; do
            curl -sL --max-time 30 "$B/libs/binder/include/binder/$f.h?format=TEXT" | base64 -d > aosp/libs/binder/include/binder/$f.h 2>/dev/null
          done
          for f in String16 String8 StrongPointer RefBase Vector Errors TextOutput Log Unicode SingleLinkedList Timers threads Mutex Condition; do
            curl -sL --max-time 30 "$B/libs/utils/include/utils/$f.h?format=TEXT" | base64 -d > aosp/libs/utils/include/utils/$f.h 2>/dev/null
          done
          wc -l aosp/libs/binder/include/binder/IBinder.h aosp/libs/utils/include/utils/String16.h 2>/dev/null
          head -3 aosp/libs/binder/include/binder/IBinder.h 2>/dev/null

      - name: build fpsbinder2
        run: |
          NDK="${{ steps.ndk.outputs.ndk-path }}"
          CXX="$NDK/toolchains/llvm/prebuilt/linux-x86_64/bin/aarch64-linux-android34-clang++"
          "$CXX" -O2 -std=c++17 -I aosp/libs/binder/include -I aosp/libs/utils/include -I aosp/include native/fpsbinder2.cpp -o fpsbinder2 -Wl,--unresolved-symbols=ignore-all -ldl 2>&1 | tail -25
          ls -lh fpsbinder2 2>/dev/null || echo "build failed"

      - uses: actions/upload-artifact@v4
        with:
          name: fpsbinder2
          path: fpsbinder2
          if-no-files-found: warn
