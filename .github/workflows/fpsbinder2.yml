name: fpsdumpsys
on: workflow_dispatch

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/no-autostart
          persist-credentials: false
      - uses: nttld/setup-ndk@v1
        id: ndk
        with:
          ndk-version: r29

      - name: build fpsdumpsys
        run: |
          NDK="${{ steps.ndk.outputs.ndk-path }}"
          CXX="$NDK/toolchains/llvm/prebuilt/linux-x86_64/bin/aarch64-linux-android34-clang++"
          "$CXX" -O2 -std=c++17 native/fpsdumpsys.cpp -o fpsdumpsys -lc++_shared -ldl 2>&1 | tail -20
          ls -lh fpsdumpsys 2>/dev/null || echo "build failed"

      - uses: actions/upload-artifact@v4
        with:
          name: fpsdumpsys
          path: fpsdumpsys
          if-no-files-found: warn
